name: Local task discovery TDD
on:
  push:
    branches:
      - tdd/447-451-local-task-discovery
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.task-discovery.test.tsx src/WorkspaceRoot.local-ui.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

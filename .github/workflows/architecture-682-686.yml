name: Architecture TDD 682-686 visible Task selection
on:
  push:
    branches: [architecture/682-686-visible-task-selection]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/domain/visible-task-selection.test.ts src/domain/task-filter.test.ts src/domain/task-sort.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

name: Gantt TDD branch checks
on:
  push:
    branches:
      - tdd/437-441-gantt-working-date-projection
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm exec -- vitest run src/domain/task-gantt-critical-path.test.ts src/WorkspaceRoot.gantt-view.test.tsx --maxWorkers=1 --testTimeout=30000

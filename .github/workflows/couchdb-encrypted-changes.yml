name: Durable encrypted CouchDB changes
on:
  push:
    branches: [storage/752-756-couchdb-encrypted-changes]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run server/couchdb-changes.test.mjs server/self-hosted-changes-http.test.mjs server/self-hosted-api.test.mjs --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

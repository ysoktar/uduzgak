name: Architecture TDD 667-676 integrated Gantt seams
on:
  push:
    branches: [architecture/667-676-gantt-integrated]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/GanttResourceDates.test.tsx src/GanttWorkingSummary.test.tsx src/domain/task-gantt-overview-selection.test.ts src/WorkspaceRoot.gantt-view.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

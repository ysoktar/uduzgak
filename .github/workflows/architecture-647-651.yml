name: Architecture TDD 647-651 Gantt resource overview
on:
  push:
    branches: [architecture/647-651-gantt-resource-overview]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/domain/task-gantt-resource-overview.test.ts src/WorkspaceRoot.gantt-resource-forecast.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

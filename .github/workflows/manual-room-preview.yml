name: Manual encrypted Task preview
on:
  push:
    branches: [sync/852-856-manual-room-preview-ui]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/ManualRoomSyncPanel.test.tsx src/sync/manual-room-preview.test.ts src/sync/task-change-preview.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

name: TDD 452-456 manual Task drag reordering
on:
  push:
    branches:
      - tdd/452-456-task-drag-order
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/domain/manual-order-drop.test.ts src/domain/workspace-drop-order.test.ts src/application/workspace-drop-order.test.ts src/WorkspaceRoot.drag-order.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

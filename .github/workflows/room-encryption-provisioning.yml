name: Room encryption secret provisioning
on:
  push:
    branches: [storage/872-876-room-encryption-secret]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run server/room-provisioning.test.mjs server/room-provisioning-encryption.test.mjs --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

name: Room-bound encrypted change envelope
on:
  push:
    branches: [storage/817-821-room-change-envelope]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/persistence/room-change-envelope.test.ts src/p2p/relay-crypto.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

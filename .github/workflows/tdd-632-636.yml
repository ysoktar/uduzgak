name: TDD 632-636 Gantt forecast calendar window
on:
  push:
    branches: [tdd/632-636-gantt-resource-forecast-window]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/domain/task-gantt-resource-forecast-window.test.ts src/domain/task-gantt-resource-completion.test.ts src/domain/task-gantt-resource-date-validation.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

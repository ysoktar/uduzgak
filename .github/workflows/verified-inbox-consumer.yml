name: Verified encrypted inbox consumer
on:
  push:
    branches: [sync/827-831-verified-inbox-consumer]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/sync/consume-register-inbox.test.ts src/sync/convergent-registers.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

name: Durable encrypted inbox
on:
  push:
    branches: [storage/802-806-encrypted-inbox]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/persistence/encrypted-inbox.test.ts src/persistence/durable-change-outbox.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

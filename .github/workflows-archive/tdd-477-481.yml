name: TDD 477-481 Workspace section navigation
on:
  push:
    branches: [tdd/477-481-workspace-section-navigation]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.sections.test.tsx src/workspace-sections-styles.test.ts src/WorkspaceRoot.local-ui.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

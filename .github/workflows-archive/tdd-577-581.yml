name: TDD 577-581 Board filter accessibility
on:
  push:
    branches: [tdd/577-581-board-filter-reset-accessibility]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.board-filter-accessibility.test.tsx src/WorkspaceRoot.board-filter-reset.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

name: Full local-first verification
on:
  push:
    branches: [main, ci/full-local-first-verification]
  pull_request:
    branches: [main]
concurrency:
  group: full-local-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm exec -- vitest run --maxWorkers=1 --testTimeout=30000

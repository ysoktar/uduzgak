name: Encrypted inbox pull
on:
  push:
    branches: [storage/807-811-inbox-pull]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/persistence/pull-encrypted-changes.test.ts src/persistence/encrypted-inbox.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

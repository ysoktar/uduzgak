name: TDD 507-511 Task search controls
on:
  push:
    branches: [tdd/507-511-task-search-controls]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.task-search-controls.test.tsx src/WorkspaceRoot.task-discovery.test.tsx src/WorkspaceRoot.search-keyboard-controls.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

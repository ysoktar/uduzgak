name: TDD 482-486 Workspace panel disclosures
on:
  push:
    branches: [tdd/482-486-workspace-panel-disclosures]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.disclosures.test.tsx src/workspace-panel-styles.test.ts src/WorkspaceRoot.local-ui.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

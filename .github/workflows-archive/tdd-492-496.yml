name: TDD 492-496 keyboard Task search
on:
  push:
    branches: [tdd/492-496-keyboard-task-search]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.keyboard-task-search.test.tsx src/WorkspaceRoot.task-discovery.test.tsx src/WorkspaceRoot.disclosures.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

name: TDD 612-616 Gantt resource contention UI
on:
  push:
    branches: [tdd/612-616-gantt-resource-conflict-ui]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.gantt-resource-conflict.test.tsx src/WorkspaceRoot.gantt-resource-visibility.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

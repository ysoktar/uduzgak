name: TDD 467-471 Project List drag controls
on:
  push:
    branches: [tdd/467-471-project-list-native-drag]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.project-list-native-drag.test.tsx src/WorkspaceRoot.project-list-drop.test.tsx src/local-ui-styles.test.ts src/project-list-drag-styles.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

name: Encrypted envelopes and convergent registers
on:
  push:
    branches: [sync/817-826-integrated-r1]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/persistence/room-change-envelope.test.ts src/sync/convergent-registers.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

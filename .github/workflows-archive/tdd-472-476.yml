name: TDD 472-476 semantic workspace shell
on:
  push:
    branches: [tdd/472-476-semantic-workspace-shell]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.shell.test.tsx src/app-shell-styles.test.ts src/WorkspaceRoot.local-ui.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

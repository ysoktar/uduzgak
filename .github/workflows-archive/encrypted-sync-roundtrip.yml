name: Explicit encrypted sync roundtrip
on:
  push:
    branches: [storage/812-816-sync-roundtrip]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/persistence/sync-encrypted-room.test.ts src/persistence/flush-encrypted-outbox.test.ts src/persistence/pull-encrypted-changes.test.ts --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

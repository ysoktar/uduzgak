name: TDD 537-541 Board status undo
on:
  push:
    branches: [tdd/537-541-board-status-undo]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.board-status-undo.test.tsx src/WorkspaceRoot.board-quick-status.test.tsx src/WorkspaceRoot.board-direct-status.test.tsx src/WorkspaceRoot.board-drag.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

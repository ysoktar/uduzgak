name: Encrypted change client and room provisioning
on:
  push:
    branches: [storage/772-781-integrated-r1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/persistence/encrypted-change-client.test.ts server/room-provisioning.test.mjs server/room-capabilities.test.mjs --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

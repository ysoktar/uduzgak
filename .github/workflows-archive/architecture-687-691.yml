name: Architecture TDD 687-691 guarded commands
on:
  push:
    branches: [architecture/687-691-guarded-commands]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/application/guarded-workspace-commands.test.ts src/WorkspaceRoot.task-template.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

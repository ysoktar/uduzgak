name: Self hosted NoSQL connection tests
on:
  push:
    branches: [storage/737-751-self-hosted-nosql]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/persistence/self-hosted-connection.test.ts src/StorageConnectionPanel.test.tsx server/self-hosted-api.test.mjs --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build

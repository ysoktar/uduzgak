name: TDD 552-556 Board accessibility
on:
  push:
    branches: [tdd/552-556-board-accessibility]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --include=dev --no-fund
      - run: npm exec -- vitest run src/WorkspaceRoot.board-accessibility.test.tsx src/WorkspaceRoot.board-direct-status.test.tsx src/WorkspaceRoot.board-status-undo.test.tsx --maxWorkers=1 --testTimeout=30000
      - run: npm run lint
      - run: npm run build
